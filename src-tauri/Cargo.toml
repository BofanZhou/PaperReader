[package]
name = "paper-reader"
version = "0.1.0"
description = "PaperReader - AI 学术论文阅读与翻译工具"
authors = ["paperreader"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "paper_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
zip = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 必须启用 windows-native！keyring 3.x 在 Windows 上若未启用该 feature，
# 会退回 mock 后端（纯内存、不持久化）——写入"成功"但重启即失。
# 启用后使用 Windows Credential Manager 真实存储。
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
